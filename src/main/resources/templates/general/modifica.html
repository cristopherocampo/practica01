<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Práctica 01 - Modificar</title>
    </head>
    <body>
        <header th:replace="~{layout/plantilla :: header}"></header>

        <section class="py-4 mb-4 bg-light">
            <div class="container">
                <div class="row">
                    <div class="col-md-3">
                        <a th:href="@{/arbol/listado}" class="btn btn-light btn-block">
                            <i class="fas fa-arrow-left"></i> Regresar
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <div class="container">
            <div class="row">
                <div class="col-md-9">
                    <form th:action="@{/arbol/guardar}" th:object="${arbol}"
                          method="POST" class="was-validated" enctype="multipart/form-data">
                        <input type="hidden" name="idArbol" th:field="*{idArbol}"/>
                        <input type="hidden" name="rutaImagen" th:field="*{rutaImagen}"/>
                        
                        <div class="card">
                            <div class="card-header">
                                <h4>Actualizar Árbol</h4>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="nombre">Nombre Común</label>
                                    <input type="text" class="form-control" name="nombre" th:field="*{nombre}" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="tipoFlor">Tipo de Flor</label>
                                    <input type="text" class="form-control" name="tipoFlor" th:field="*{tipoFlor}" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="durezaMadera">Dureza de Madera</label>
                                    <input type="text" class="form-control" name="durezaMadera" th:field="*{durezaMadera}" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="edadArbol">Edad (años)</label>
                                    <input type="number" class="form-control" name="edadArbol" th:field="*{edadArbol}" required="true"/>
                                </div>
                                <div class="mb-3">
                                    <label for="activo">Activo</label>
                                    <input class="form-check-input" type="checkbox" name="activo" id="activo" th:field="*{activo}"/>
                                </div>
                                <div class="mb-3">
                                    <label for="imagen">Imagen</label>
                                    <input class="form-control" type="file" name="imagenFile" onchange="readURL(this);"/>
                                    <img id="blah" th:src="@{${arbol.rutaImagen}}" alt="tu imagen" height="200"/>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-check"></i> Guardar Cambios
                                </button>
                                <a th:href="@{/arbol/eliminar/}+${arbol.idArbol}" class="btn btn-danger">
                                    <i class="fas fa-trash"></i> Eliminar
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{layout/plantilla :: footer}"></footer>
        
        <script>
            function readURL(input) {
                if (input.files && input.files[0]) {
                    var reader = new FileReader();
                    reader.onload = function (e) {
                        $('#blah').attr('src', e.target.result).height(200);
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            }
        </script>
    </body>
</html>
