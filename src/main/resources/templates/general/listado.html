<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Práctica 01</title>
    </head>
    <body>
        <header th:replace="~{layout/plantilla :: header}"></header>

        <section class="py-4 mb-4 bg-light">
            <div class="container">
                <div class="row">
                    <div class="col-md-3">
                        <button type="button" 
                                class="btn btn-primary btn-block" 
                                data-bs-toggle="modal" 
                                data-bs-target="#agregarArbol">
                            <i class="fas fa-plus"></i> Agregar Árbol
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <div class="container mt-4">
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header">
                            <h4>Listado de Árboles</h4>
                        </div>
                        <div class="card-body">
                            <table class="table table-striped">
                                <thead class="table-dark">
                                    <tr>
                                        <th>#</th>
                                        <th>Nombre </th>
                                        <th>Tipo Flor</th>
                                        <th>Dureza</th>
                                        <th>Edad</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="a, contador : ${arboles}">
                                        <td>[[${contador.count}]]</td>
                                        <td>
                                            <img th:src="${a.rutaImagen}" alt="árbol" 
                                                 style="width: 80px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;"/>
                                        </td>
                                        <td>[[${a.nombre}]]</td>
                                        <td>[[${a.tipoFlor}]]</td>
                                        <td>[[${a.durezaMadera}]]</td>
                                        <td>[[${a.edadArbol}]] años</td>
                                        <td th:text="${a.activo} ? 'Activo' : 'Inactivo'"></td>
                                        <td>
                                            <a th:href="@{/arbol/eliminar/}+${a.idArbol}" class="btn btn-danger btn-sm">Eliminar</a>
                                            <a th:href="@{/arbol/modificar/}+${a.idArbol}" class="btn btn-success btn-sm">Modificar</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <div class="alert alert-info text-center" th:if="${arboles == null or arboles.empty}">
                                No hay árboles registrados.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="agregarArbol" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-md">
                <div class="modal-content">
                    <div class="modal-header bg-info text-white">
                        <h5 class="modal-title">Agregar Árbol</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/arbol/guardar}" th:object="${arbol}"
                          method="POST" class="was-validated" enctype="multipart/form-data">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="nombre">Nombre Común</label>
                                <input type="text" class="form-control" name="nombre" required="true"/>
                            </div>
                            <div class="mb-3">
                                <label for="tipoFlor">Tipo de Flor</label>
                                <input type="text" class="form-control" name="tipoFlor" required="true"/>
                            </div>
                            <div class="mb-3">
                                <label for="durezaMadera">Dureza de Madera</label>
                                <input type="text" class="form-control" name="durezaMadera" required="true"/>
                            </div>
                            <div class="mb-3">
                                <label for="edadArbol">Edad (años)</label>
                                <input type="number" class="form-control" name="edadArbol" required="true"/>
                            </div>
                            <div class="mb-3">
                                <label for="activo">Activo</label>
                                <input class="form-check-input" type="checkbox" name="activo" id="activo"/>
                            </div>
                            <div class="mb-3">
                                <label for="imagen">Imagen</label>
                                <input class="form-control" type="file" name="imagenFile" onchange="readURL(this);"/>
                                <img id="blah" src="#" alt="tu imagen" height="200" style="display:none;"/>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-primary" type="submit">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{layout/plantilla :: footer}"></footer>
    </body>
</html>
